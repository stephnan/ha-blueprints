blueprint:
  name: Reboot Unifi Devices
  description: Reboots selected Unifi Devices one after another
  domain: script
  input:
    unifi_devices:
      name: Unifi Device Restart Button
      description: Unifi Device Restart Button
      selector:
        entity:
          integration: unifi
          domain:
          - button
          multiple: true
          reorder: false

mode: single
sequence:
- continue_on_error: true
  repeat:
    for_each: !input unifi_devices
    sequence:
    - action: button.press
      continue_on_error: true
      target:
        entity_id: '{{ repeat.item }}'
    - if:
      - condition: template
        value_template: '{{ not repeat.last }}'
      then:
      - delay:
          hours: 0
          minutes: 15
          seconds: 0
          milliseconds: 0
