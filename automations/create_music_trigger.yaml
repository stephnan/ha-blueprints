blueprint:
  name: Create Music Card automation
  domain: automation
  input:
    motion_sensor:
      name: RFID Sensor
      description: The name of the RFID sensor
      selector:
        entity:
          filter:
          - domain:
            - binary_sensor
          multiple: false
          reorder: false
    target_script:
      name: Script to run
      description: Script to run as entity
      selector:
        target:
          entity:
          - domain:
            - script

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    from: 
    to: "on"

actions:
  - action: script.turn_on
    target: !input target_script
